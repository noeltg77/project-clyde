services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      - WORKING_DIR=/app/working
      - CLAUDE_CLI_PATH=/usr/local/bin/claude
      - CORS_ORIGINS=http://localhost:3020,http://127.0.0.1:3020
    volumes:
      - ./working:/app/working
      - ./.env.local:/app/.env.local
      - /var/run/docker.sock:/var/run/docker.sock
      - ./frontend/public/avatars:/app/frontend/public/avatars:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        NEXT_PUBLIC_BACKEND_WS_URL: ${NEXT_PUBLIC_BACKEND_WS_URL:-ws://localhost:8000}
    ports:
      - "3020:3020"
    depends_on:
      - backend
    restart: unless-stopped
